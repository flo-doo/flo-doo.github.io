name: Apply publication topic labels

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: publication-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply selected publication labels
        run: python scripts/apply_publication_review.py
      - name: Commit publication classification
        shell: bash
        run: |
          if git diff --quiet -- data/publications-curated.json data/publications.json data/publication-topics.json data/publication-topic-review.json index.html publications.html sitemap.xml; then
            echo "No publication-classification changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications-curated.json data/publications.json data/publication-topics.json data/publication-topic-review.json index.html publications.html sitemap.xml
          git commit -m "Apply publication research-area review"
          git pull --rebase origin main
          git push origin HEAD:main
