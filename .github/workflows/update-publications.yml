name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile completed publication reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reconcile_publication_review_issues.py
      - name: Refresh ORCID-backed publication cache
        run: python scripts/update_publications.py
      - name: Commit changes if needed
        shell: bash
        run: |
          FILES=(
            data/publications-curated.json
            data/publications.json
            data/publication-topics.json
            data/publication-topic-review.json
            data/publication-metadata-review.json
            index.html
            publications.html
            sitemap.xml
            sitemap.txt
          )
          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No publication changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${FILES[@]}"
            git commit -m "Update ORCID-backed publication index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reconcile publication review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_publication_review_issues.py
      - name: Publication review summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except FileNotFoundError:
                  return {'count': 0, 'items': []}

          topic = load('data/publication-topic-review.json')
          metadata = load('data/publication-metadata-review.json')
          topic_count = topic.get('count', 0)
          metadata_count = metadata.get('count', 0)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')

          lines = [
              '## Publication update',
              '',
              f'Pending research-area review: **{topic_count}** publication(s).',
              f'Held back for incomplete metadata: **{metadata_count}** ORCID work(s).',
          ]
          if topic_count:
              lines += ['', 'Use the `pub:` labels in the review issue(s) to classify newly published records.']
          if metadata_count:
              lines += ['', 'Incomplete ORCID records were **not** added to the public site.']
              for item in metadata.get('items', [])[:10]:
                  lines.append(f"- {item.get('title') or '[untitled]'} — {item.get('reason')}")
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
