name: Update publications
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve prior topic-review state
        shell: bash
        run: |
          if [ -f data/publication-topic-review.json ]; then
            cp data/publication-topic-review.json /tmp/publication-topic-review-old.json
          else
            printf '{"count":0,"items":[]}\n' > /tmp/publication-topic-review-old.json
          fi
      - name: Refresh publication cache
        run: python scripts/update_publications.py
      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet -- data/publications.json data/publication-topic-review.json index.html publications.html sitemap.xml; then
            echo "No publication changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json data/publication-topic-review.json index.html publications.html sitemap.xml
            git commit -m "Update publication index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag newly unclassified publications
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          old=json.load(open('/tmp/publication-topic-review-old.json'))
          new=json.load(open('data/publication-topic-review.json'))
          old_keys={x['key'] for x in old.get('items',[])}
          added=[x for x in new.get('items',[]) if x['key'] not in old_keys]
          if not added:
              print('No newly unclassified publications.')
              raise SystemExit(0)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          lines=['## Publication topic review needed','',f'{len(added)} new publication(s) were added without a research-topic tag:','']
          lines += [f"- {x.get('year') or ''}: {x.get('title')}" for x in added]
          lines += ['', 'Edit `data/publication-topics.json` to assign one or more topic tags.']
          if summary:
              with open(summary,'a',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          print('::warning::New publications need topic review. See the workflow summary and data/publication-topic-review.json.')
          # Fail only on the first run that sees a new unclassified item. The review file
          # is already committed, so later scheduled runs will not repeat the failure.
          raise SystemExit(1)
          PY
