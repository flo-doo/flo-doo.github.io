name: Refresh publications

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_publications.py"
      - ".github/workflows/update-publications.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Update publication metadata
        env:
          CROSSREF_MAILTO: fdoo@som.umaryland.edu
        run: python scripts/update_publications.py
      - name: Commit changes when metadata changed
        run: |
          if git diff --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "chore: refresh publications"
          git push
