name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ORCID-backed publication cache
        run: python scripts/update_publications.py
      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet -- data/publications.json data/publication-topic-review.json index.html publications.html sitemap.xml; then
            echo "No publication changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json data/publication-topic-review.json index.html publications.html sitemap.xml
            git commit -m "Update ORCID-backed publication index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Create review issues for unclassified ORCID publications
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_publication_review_issues.py
      - name: Publication review summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          review=json.load(open('data/publication-topic-review.json'))
          count=review.get('count',0)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          lines=['## Publication update','',f'Pending research-area review: **{count}** publication(s).']
          if count:
              lines += ['', 'Review issue(s) were created/updated and assigned to the repository owner. Use the `pub:` labels in each issue to classify the publication.']
          if summary:
              with open(summary,'a',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
