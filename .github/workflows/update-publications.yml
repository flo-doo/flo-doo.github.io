name: Update publications
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh publication cache
        run: python scripts/update_publications.py
      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publication index"
          git pull --rebase origin main
          git push origin HEAD:main
