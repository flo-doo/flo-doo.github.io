<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page not found | Florence Doo</title>
  <script>
    try {
      if (localStorage.getItem('florence-doo-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="publications-main">
    <section class="publications-hero">
      <p class="section-label">404</p>
      <h1>Page not found.</h1>
      <p>The page may have moved during the site redesign.</p>
      <div class="hero-links"><a href="/">Return home</a></div>
    </section>
  </main>
</body>
</html>
